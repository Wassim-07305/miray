<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un ami t’invite sur Miray</title>
<meta name="description" content="Un ami t'invite sur Miray, l'ami du quotidien qui t'aide à tenir tes objectifs. 7 jours offerts pour essayer.">
<meta property="og:title" content="Un ami t'invite sur Miray">
<meta property="og:description" content="Tu sais ce que tu veux changer. Miray t'aide à le tenir. 7 jours offerts.">
<meta property="og:image" content="https://wassim-07305.github.io/miray/img/panorama.jpg">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="apple-touch-icon" href="../img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Page d'invitation du parrainage (lien …/miray/i/?c=CODE partagé par l'app).
   Même design que l'accueil du site (../index.html : en-tête, héros sur le panorama, badge App Store, iPhone et deux Miray).
   Le bouton COPIE le code puis ouvre l'App Store ; dans l'app, l'écran « Un ami t'a invité ? » le colle d'un toucher. */
:root{
  --nuit:#070a10; --nuit2:#0e131b; --carte:#141a22; --trait:rgba(255,255,255,.09);
  --texte:#EEF8FC; --doux:#A9B4BA; --peche:#6FB8F2; --creme:#9FE0FD;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--nuit);color:var(--texte);font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.page{max-width:1160px;margin:0 auto;padding:0 24px}
.degrade{background:linear-gradient(180deg,#fff 10%,var(--creme) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.entete{position:absolute;inset:0 0 auto 0;z-index:50}
.entete .page{display:flex;align-items:center;justify-content:space-between;height:68px}
.marque{display:flex;align-items:flex-end;gap:4px;font-weight:700;font-size:24px;letter-spacing:-.5px}
.marque img{height:30px;width:auto;margin-bottom:1px}
.btn-petit{background:var(--texte);color:#0b1318;font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px}
.heros{position:relative;min-height:100svh;display:flex;align-items:center;padding:120px 0 0;overflow:hidden}
.heros::before{content:"";position:absolute;inset:0;background:url(../img/panorama.jpg) center 70%/cover;z-index:-2}
.heros::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,16,.55) 0%,rgba(7,10,16,.15) 40%,rgba(7,10,16,.35) 75%,var(--nuit) 100%);z-index:-1}
.heros .page{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;width:100%}
.etiquette{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--peche);text-transform:uppercase}
h1{font-size:clamp(42px,4.3vw,62px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin-top:12px;text-wrap:balance}
h1 .ligne{display:block}
.sous{font-size:clamp(18px,1.6vw,21px);color:#D5E3EA;max-width:520px;margin-top:22px}
.carte-code{margin-top:30px;display:inline-flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:22px;border:1px solid var(--trait);
  background:radial-gradient(110% 80% at 50% 120%,rgba(111,184,242,.18),transparent 62%),linear-gradient(180deg,rgba(20,26,34,.85),rgba(14,19,27,.85));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.carte-code small{color:var(--doux);font-size:14px;font-weight:600}
.code{display:flex;gap:8px}
.code span{width:48px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#232a33,#151a21);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.actions{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap}
.appstore{display:inline-flex;align-items:center;gap:12px;background:#000;border:1px solid rgba(255,255,255,.28);color:#fff;padding:10px 22px 10px 18px;border-radius:14px;cursor:pointer;font:inherit;text-align:left;transition:transform .2s,box-shadow .2s}
.appstore:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(111,184,242,.25)}
.appstore:active{transform:scale(.97)}
.appstore svg{width:28px;height:28px;flex:0 0 auto}
.appstore small{display:block;font-size:11px;line-height:1;opacity:.85}
.appstore b{display:block;font-size:21px;line-height:1.1;font-weight:600;letter-spacing:-.3px}
.essai{color:#D5E3EA;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.aide{margin-top:16px;color:#C3CED4;text-shadow:0 1px 8px rgba(0,0,0,.6);font-size:15px;max-width:460px;min-height:24px}
.aide b{color:var(--creme);font-weight:600}
.sans-code .carte-code{display:none}
.scene{position:relative;height:min(78svh,700px);display:flex;justify-content:center;align-items:flex-end}
.tel{position:relative;width:min(320px,70vw);aspect-ratio:1350/2760;filter:drop-shadow(0 40px 60px rgba(0,0,0,.5))}
.tel .ecran{position:absolute;left:5.33%;top:2.5%;width:89.33%;height:95%;border-radius:12%/6%;overflow:hidden;background:#000}
.tel .ecran img{width:100%;height:100%;object-fit:cover}
.tel .cadre{position:absolute;inset:0;width:100%;height:100%}
.scene .compagnon{position:absolute;filter:drop-shadow(0 0 2px rgba(190,227,244,.5)) drop-shadow(0 0 40px rgba(111,184,242,.3)) drop-shadow(0 28px 34px rgba(0,0,0,.5))}
.scene .c1{left:-4%;bottom:-2%;height:42%}
.scene .c2{right:-2%;bottom:6%;height:36%}
@media (max-width:860px){
  body{font-size:17px}
  .page{padding:0 20px}
  .heros{padding:96px 0 0;min-height:auto}
  .heros .page{grid-template-columns:1fr;gap:10px}
  h1{font-size:40px;line-height:1.05}
  .sous{font-size:17px;margin-top:16px}
  .carte-code{margin-top:24px}
  .actions{margin-top:22px;gap:12px}
  .scene{height:auto;margin:36px -20px 0;padding:28px 0 0;background:radial-gradient(70% 60% at 50% 70%,rgba(111,184,242,.28),transparent 70%)}
  .scene .tel{width:230px}
  .scene .c1{left:2%;bottom:0;height:34%}
  .scene .c2{right:2%;bottom:4%;height:30%}
}
</style>
</head>
<body>
<header class="entete">
  <div class="page">
    <a class="marque" href="../" aria-label="Miray"><img src="../img/logo-m.png" alt="">iray</a>
    <a class="btn-petit" href="https://apps.apple.com/app/id6835616990">Télécharger</a>
  </div>
</header>
<main>
  <section class="heros">
    <div class="page sans-code" id="page">
      <div>
        <span class="etiquette">Un ami t’invite</span>
        <h1><span class="ligne">Tu sais ce que tu veux changer.</span> <span class="degrade ligne">Miray t’aide à le tenir.</span></h1>
        <p class="sous">Ton ami du quotidien sur iPhone. Tu lui dis tes objectifs, il est là chaque jour : sommeil, sport, concentration, temps d’écran.</p>
        <div class="carte-code">
          <small>Le code de ton ami</small>
          <div class="code" id="code" aria-live="polite"></div>
        </div>
        <div class="actions">
          <button class="appstore" id="bouton" type="button" aria-label="Copier le code et télécharger sur l’App Store">
            <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.37 12.62c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.89 1.15 9.14.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.38-.91-2.39-3.66zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"/></svg>
            <span><small id="petit">Télécharger dans</small><b>l’App Store</b></span>
          </button>
          <span class="essai">7 jours offerts pour essayer</span>
        </div>
        <p class="aide" id="aide"></p>
      </div>
      <div class="scene">
        <div class="tel"><div class="ecran"><img src="../img/ecran-accueil.jpg" alt="L’accueil de Miray : ton Miray, ton score du jour et tes objectifs"></div><img class="cadre" src="../img/cadre-iphone.png" alt=""></div>
        <img class="compagnon c1" src="../img/miray-onyx-f.png" alt="">
        <img class="compagnon c2" src="../img/miray-ceramique.png" alt="">
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var APP = 'https://apps.apple.com/app/id6835616990';
  var brut = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var code = /^[ABCDEFGHJKMNPQRSTUVWXYZ2-9]{5}$/.test(brut) ? brut : '';
  var page = document.getElementById('page');
  var aide = document.getElementById('aide');
  if (code) {
    page.classList.remove('sans-code');
    var boite = document.getElementById('code');
    code.split('').forEach(function (l) { var s = document.createElement('span'); s.textContent = l; boite.appendChild(s); });
    boite.setAttribute('aria-label', 'Code ' + code.split('').join(' '));
    document.getElementById('petit').textContent = 'Copier le code et télécharger dans';
    aide.innerHTML = 'Dans l’app, touche <b>Coller</b> à l’écran « Un ami t’a invité ? ».';
  }
  // copie synchrone (dans le toucher) : la méthode la plus sûre sur Safari, puis l'API moderne en secours
  function copier(t) {
    var ok = false;
    try {
      var z = document.createElement('textarea');
      z.value = t; z.setAttribute('readonly', ''); z.style.position = 'fixed'; z.style.opacity = '0';
      document.body.appendChild(z); z.select(); z.setSelectionRange(0, t.length);
      ok = document.execCommand('copy');
      document.body.removeChild(z);
    } catch (e) {}
    if (!ok && navigator.clipboard) { navigator.clipboard.writeText(t).catch(function () {}); ok = true; }
    return ok;
  }
  document.getElementById('bouton').addEventListener('click', function () {
    if (code) {
      copier(code);
      aide.innerHTML = 'Code <b>' + code + '</b> copié. Dans l’app, touche <b>Coller</b> à l’écran « Un ami t’a invité ? ».';
      setTimeout(function () { location.href = APP; }, 450);
    } else {
      location.href = APP;
    }
  });
})();
</script>
</body>
</html>
